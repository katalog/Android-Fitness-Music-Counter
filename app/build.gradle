plugins {
    id 'com.android.application'
    id 'kotlin-android'

    id 'com.google.gms.google-services'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
}

Properties properties = new Properties()
File securePropsFile = project.rootProject.file('../../Git-Privates/Keys/gitKeyStore/FitnessMusicCounter/secure.properties')
if (!securePropsFile.exists()) {
    securePropsFile = project.rootProject.file('../gitKeyStore/FitnessMusicCounter/secure.properties')
}
if (securePropsFile.exists()) {
    properties.load(securePropsFile.newDataInputStream())
} else {
    println "WARNING: secure.properties not found!"
}

android {
    namespace 'com.mkstudio.FitnessMusicCounter'
    compileSdk 34

    defaultConfig {
        applicationId "com.mkstudio.FitnessMusicCounter"
        minSdkVersion 24
        targetSdk 34
        versionCode 3
        versionName "1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    buildFeatures {
        compose true
        viewBinding true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.15"
    }

    buildTypes {
        // to replace double quotes problem in manifest file
        def appkey = properties['app_api_key'] ?: "ca-app-pub-3940256099942544~3347511713"
        appkey = appkey.replace('"', '')
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "APP_API_KEY", properties['app_api_key'] ?: "\"ca-app-pub-3940256099942544~3347511713\""
            buildConfigField "String", "FULL_ADS_KEY", properties['ads_full_key'] ?: "\"ca-app-pub-3940256099942544/1033173712\""
            manifestPlaceholders = ["APP_KEY": appkey]
        }
        debug {
            buildConfigField "String", "APP_API_KEY", properties['app_api_key'] ?: "\"ca-app-pub-3940256099942544~3347511713\""
            buildConfigField "String", "FULL_ADS_KEY", properties['ads_test_key'] ?: "\"ca-app-pub-3940256099942544/1033173712\""
            manifestPlaceholders = ["APP_KEY": appkey]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation "androidx.multidex:multidex:2.0.1"

    // Compose BOM & UI
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // AndroidX Media3 (Replaces ExoPlayer 2)
    def media3_version = "1.3.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-analytics-ktx'

    // Hilt dependencies
    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-android-compiler:$hilt_version"
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    // Room
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}